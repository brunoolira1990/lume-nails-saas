<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <defs>
    <linearGradient id="lumeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Abstract nail / sparkle mark -->
  <path
    d="M30 42 L45 18 L60 42 L30 30 L60 30 L30 42 Z"
    fill="url(#lumeGrad)"
    filter="url(#glow)"
  />
  <circle cx="45" cy="24" r="6" fill="#F59E0B" />
  <!-- Wordmark -->
  <text x="80" y="38" font-family="'Plus_Jakarta Sans', sans-serif" font-weight="700" font-size="22" fill="#1F2937" letter-spacing="-0.02em">Lume</text>
  <text x="148" y="38" font-family="'Great Vibes', cursive" font-size="28" fill="#8B5CF6">Nails</text>
</svg>
